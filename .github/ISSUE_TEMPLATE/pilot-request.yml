name: Pilot request
description: Ask to run a free 30-day (or longer) evaluation pilot of the simulator at your agency or training program.
title: "Pilot request: <organization>"
labels: ["pilot-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest. This issue is **public** — please don't include personal phone numbers, personal email addresses, or anything sensitive. We'll follow up here to arrange a private channel.
        The simulator is a training tool only: it never connects to real aircraft, airspace, dispatch, or cameras.
  - type: input
    id: organization
    attributes:
      label: Organization
      description: Agency, school, or program name.
    validations:
      required: true
  - type: dropdown
    id: org_type
    attributes:
      label: Organization type
      options:
        - Police / sheriff drone program
        - Fire / EMS drone program
        - Emergency management or SAR team
        - High-school CTE program
        - College or university UAS program
        - Public-safety training academy
        - Other
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Your role
      description: For example program lead, instructor, training officer.
  - type: textarea
    id: use_case
    attributes:
      label: What would you use it for?
      description: Mission types (wildfire, flood, hazmat, collapse, perimeter, inspection, search), crew or class size, and what you'd want to learn in 30 days.
    validations:
      required: true
  - type: dropdown
    id: devices
    attributes:
      label: Devices you'd use
      multiple: true
      options:
        - Windows PCs
        - Macs
        - Phones
        - Chromebooks (not supported yet)
        - iPads (not supported yet)
