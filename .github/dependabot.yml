version: 2
# Every push to a Dependabot branch triggers a preview build on all four Vercel
# projects, and branch protection requires those four checks, so their builds
# cannot simply be switched off for these branches. On 2026-09-22 five
# Dependabot branches were pushed 20 times, mostly auto-rebases after each
# merge to main: about 80 builds against the Vercel Hobby limit of 100 per day.
# That exhausted the limit and the day's production promote was rate limited.
# So the updates arrive as at most three grouped PRs a week, and Dependabot does
# not rebase them on its own. Comment "@dependabot rebase" on a PR when you are
# ready to merge it.
#
# Majors are grouped rather than ignored. A lone major is often half of a
# version-locked pair (@types/react + @types/react-dom, vite +
# @vitejs/plugin-react, vitest + @vitest/coverage-v8). One grouped PR moves both
# halves together. It may still need a migration commit before it passes (see
# #106, which replaced #102-#105).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      majors:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
