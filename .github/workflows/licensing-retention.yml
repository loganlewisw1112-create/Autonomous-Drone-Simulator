name: Enforce licensing retention

# The daily schedule is intentionally disabled.
#
# This job targets the `production-licensing` environment, which enforces
# `required_reviewers`. A scheduled run therefore parks in `pending` with zero
# jobs until a human approves it, and is superseded/cancelled ~24h later. Between
# 2026-08-02 and 2026-08-27 that produced 22 cancelled runs, 1 failure and 0
# successes: the purge has never executed.
#
# The licensing service itself has also never completed a production deployment
# (`deploy-licensing.yml`, last attempt 2026-08-01, failed), so there is no
# production database for this transaction to act on. A daily job that cannot
# run is worse than no job: it burns Actions minutes and implies an enforced
# retention control that is not in force.
#
# Re-enable the `schedule:` block below in the same change that lands the first
# successful production licensing deployment, and remove the corresponding
# caveat in DATA_PRIVACY_RETENTION.md. Until then the purge remains available
# on demand via workflow_dispatch.
on:
  # schedule:
  #   - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licensing-retention
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-licensing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/licensing/package-lock.json
      - run: npm install --global npm@11.12.1
      - run: npm ci --prefix services/licensing
      - name: Apply licensing retention transaction
        run: npm --prefix services/licensing run purge-retention
        env:
          DATABASE_URL: ${{ secrets.LICENSING_DATABASE_URL_UNPOOLED }}
